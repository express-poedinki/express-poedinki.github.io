<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Экспресс-поединки</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Экспресс">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181b" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface2:#ece7dc; --ink:#1d1f22; --muted:#6b6a66;
  --line:#ddd6c8; --accent:#b4432a; --accent-ink:#fff; --ok:#2f7d4f; --part:#c08a1e;
  --quote:#1d1f22; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --surface:#1f2226; --surface2:#2a2e33; --ink:#ecebe7; --muted:#9b9a95;
    --line:#33373d; --accent:#e0694f; --accent-ink:#16181b; --ok:#5cb47f; --part:#d9a640;
    --quote:#f4f2ec; --shadow:none;
  }
}
:root[data-theme="dark"]{
    --bg:#16181b; --surface:#1f2226; --surface2:#2a2e33; --ink:#ecebe7; --muted:#9b9a95;
    --line:#33373d; --accent:#e0694f; --accent-ink:#16181b; --ok:#5cb47f; --part:#d9a640;
    --quote:#f4f2ec; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  min-height:100vh;padding-bottom:calc(24px + var(--safe-b))}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:var(--safe-t);
  border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--line)}
.bar{display:flex;align-items:center;gap:8px;min-height:52px}
.brand{flex:1;min-width:0;padding:6px 0 4px}
.over{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}
.bar h1{font-size:19px;margin:0;flex:1;letter-spacing:-.01em;font-weight:700}
.bar .ttl{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.ib{border:0;background:transparent;min-width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  color:var(--accent);font-size:16px;font-weight:600;padding:0 8px}
.ib:active{background:var(--surface2)}
.ib svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.progress{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);padding:2px 0 10px}
.pbar{flex:1;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:0 12px;height:42px}
.search svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{border:0;outline:0;background:transparent;flex:1;font-size:16px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:15px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* list */
.list{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:14px;box-shadow:var(--shadow);text-align:left;width:100%}
.card:active{transform:scale(.99)}
.num{flex:none;min-width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;
  font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;padding:0 6px}
.num.spare{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.card .body{flex:1;min-width:0}
.card .t{font-weight:600;font-size:16px;display:flex;gap:6px;align-items:center}
.card .q{color:var(--muted);font-size:15px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin-top:4px}
.dot.part{border-color:var(--part);background:linear-gradient(90deg,var(--part) 50%,transparent 50%)}
.dot.full{border-color:var(--ok);background:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* detail */
.kicker{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:16px 0 4px}
.dtitle{font-size:26px;line-height:1.2;font-weight:700;margin:0 0 12px;letter-spacing:-.015em}
.desc{margin:0 0 16px;white-space:pre-wrap}
.quote{position:relative;font-size:23px;line-height:1.3;font-weight:600;color:var(--quote);
  padding:16px 18px 16px 20px;background:var(--surface);border-radius:16px;border:1px solid var(--line);margin-bottom:8px}
.quote::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 3px 3px 0;background:var(--accent)}
.role{margin-top:22px}
.rolehead{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rolehead h3{margin:0;font-size:19px;flex:1}
.said{font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);border-radius:6px;padding:2px 7px;vertical-align:3px;white-space:nowrap}
.var{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 14px 12px;margin-bottom:10px;box-shadow:var(--shadow)}
.var + .var{margin-top:0}
.vhead{display:flex;align-items:center;justify-content:space-between;min-height:36px;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.vhead .ib{min-width:36px;height:36px;color:var(--muted)}
.fl{display:block;font-size:14px;font-weight:600;margin:6px 0 4px}
.fl.a{color:var(--accent)}
.fl.c{color:var(--ok)}
.fl.n{color:var(--ink)}
.var.an{background:var(--surface2);box-shadow:none;border-style:dashed}
.var.an textarea.f{background:var(--surface)}
textarea.f{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;
  font-size:17px;line-height:1.4;resize:none;min-height:52px;outline:0;overflow:hidden;display:block}
textarea.f:focus{border-color:var(--accent)}
.link{border:0;background:transparent;color:var(--accent);font-weight:600;padding:10px 0;font-size:16px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;font-size:17px;background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dng{background:transparent;color:#c0392b;border:1px solid currentColor}
.btn.full{width:100%}
.row{display:flex;gap:10px;margin-top:20px}
.row .btn{flex:1}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:8px 16px calc(20px + var(--safe-b))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 8px}
.sheet h2{font-size:20px;margin:6px 0 12px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:14px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.fld input,.fld select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;font-size:17px;outline:0}
.fld textarea.f{background:var(--surface)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px;font-size:15px;font-weight:600}
.seg button.on{background:var(--surface);box-shadow:var(--shadow)}
.menu button{display:block;width:100%;text-align:left;border:0;background:var(--surface);padding:15px 16px;font-size:17px;border-bottom:1px solid var(--line)}
.menu button:first-child{border-radius:14px 14px 0 0}
.menu button:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.menu .note{font-size:14px;color:var(--muted);padding:12px 4px 0}

/* training */
.tr-q{font-size:27px;line-height:1.28;font-weight:700;margin:6px 0 18px}
.tr-desc{color:var(--muted);margin-bottom:6px}
.rolepick{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 14px}
.reveal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.reveal .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.reveal .lbl.a{color:var(--accent)} .reveal .lbl.c{color:var(--ok)} .reveal .lbl.n{color:var(--muted)}
.reveal .txt{white-space:pre-wrap;font-size:19px}
.cover{border:2px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted);font-weight:600;background:transparent;width:100%;margin-bottom:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);font-size:15px}
.plink{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:14px;padding:4px 0 4px 6px;white-space:nowrap}
.meta{display:block;font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.meta .w{color:var(--ok)} .meta .l{color:var(--accent)}
.sec{font-size:20px;margin:30px 0 10px;display:flex;align-items:baseline;gap:8px}
.sec small{font-size:14px;color:var(--muted);font-weight:600}
.game{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.game .gb{flex:1;min-width:0}
.game .g1{font-weight:600;font-size:16px}
.game .g2{font-size:14px;color:var(--muted);margin-top:2px}
.game .g3{font-size:15px;margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.res{flex:none;font-size:13px;font-weight:700;border-radius:8px;padding:4px 8px;background:var(--surface2);color:var(--muted);text-align:center;min-width:76px}
.res.win{background:var(--ok);color:#fff} .res.loss{background:var(--accent);color:var(--accent-ink)} .res.draw{background:var(--part);color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.opps{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.opp{display:flex;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px;width:100%;text-align:left}
.opp span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ver{text-align:center;color:var(--muted);font-size:13px;padding:22px 0 6px}
.round{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;margin:4px 0 16px}
.rbig{font-size:60px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.05}
.rbig.warn{color:var(--accent)}
.rlbl{font-size:15px;color:var(--muted);font-weight:600;margin-bottom:6px}
.rmsg{font-weight:700;font-size:17px;margin-bottom:10px}
.rbar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:12px 0 14px}
.rbar i{display:block;height:100%;background:var(--accent);transition:width .2s linear}
.round .btn{min-width:160px}
.round.flash{animation:rflash .5s 3}
@keyframes rflash{50%{background:var(--accent);color:var(--accent-ink)}}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;font-size:15px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
</style>
<script>try{var th=localStorage.getItem("express-poedinki-theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
</head>
<body>

<!-- LIST -->
<section id="vList">
  <div class="top" id="topList"><div class="wrap">
    <div class="bar">
      <div class="brand"><div class="over">КСТ. Дзен-клуб. 2026</div><h1>Экспресс-поединки</h1></div>
      <button class="ib" id="btnTrainAll" aria-label="Тренировка"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="ib" id="btnMenu" aria-label="Меню"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
      <button class="ib" id="btnAdd" aria-label="Добавить ситуацию"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="progress"><div class="pbar"><i id="pbar"></i></div><span id="ptext"></span><button class="plink" id="btnJournal"></button></div>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Поиск по ситуациям и фразам" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
  </div></div>
  <div class="wrap"><div class="list" id="list"></div><div class="ver" id="verFoot"></div></div>
</section>

<!-- DETAIL -->
<section id="vDetail" class="hidden">
  <div class="top" id="topDetail"><div class="wrap"><div class="bar">
    <button class="ib" id="dBack" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="ttl" id="dBarTitle"></div>
    <button class="ib" id="dEdit">Правка</button>
  </div></div></div>
  <div class="wrap" id="dBody"></div>
</section>

<!-- JOURNAL -->
<section id="vJournal" class="hidden">
  <div class="top"><div class="wrap"><div class="bar">
    <button class="ib" id="jBack" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="ttl">Журнал поединков</div>
    <button class="ib" id="jAdd" aria-label="Записать поединок"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div></div></div>
  <div class="wrap" id="jBody"></div>
</section>

<!-- TRAIN -->
<section id="vTrain" class="hidden">
  <div class="top"><div class="wrap"><div class="bar">
    <button class="ib" id="tBack" aria-label="Закрыть"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="ttl" id="tBarTitle">Тренировка</div>
    <span class="timer" id="tTimer"></span>
  </div></div></div>
  <div class="wrap" id="tBody"></div>
</section>

<div id="sheetHost"></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" class="hidden">

<script>
"use strict";
/* ---------- theme ---------- */
const THEME_KEY = "express-poedinki-theme";
function getTheme(){ try{ return localStorage.getItem(THEME_KEY) || "auto"; }catch(e){ return "auto"; } }
function applyTheme(){
  const th = getTheme(), root = document.documentElement;
  if(th === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", th);
  const dark = th === "dark" || (th === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.querySelectorAll('meta[name="theme-color"]').forEach(m => { m.removeAttribute("media"); m.content = dark ? "#16181b" : "#f4f1ea"; });
}
function setTheme(th){ try{ localStorage.setItem(THEME_KEY, th); }catch(e){} applyTheme(); }
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
const SEED = [{"id": "o1","kind": "main","num": "1","title": "Человек собаке друг","text": "На прогулке с собакой Наталья заметила, что соседка Елена не убрала за своим питомцем. Наталья предложила Елене пакетик, чтобы та исправила ситуацию, но в ответ услышала:","phrase": "Если тебе надо, ты и убирай!","roles": ["Елена","Наталья"]},{"id": "o2","kind": "main","num": "2","title": "Идеальный монтаж","text": "Марина купила дорогую люстру. Пригласила электрика Игоря и объясняет ему, что монтаж светильника нужно производить строго по инструкции. На что Игорь отвечает:","phrase": "Тогда вы ее вешайте, а я инструкцию вам зачитаю","roles": ["Игорь, электрик","Марина"]},{"id": "o3","kind": "main","num": "3","title": "Нормальный специалист","text": "Совещание команды по проекту вел генеральный директор, а не лидер команды, так как по проекту были большие проблемы. Дойдя до раздела маркетинга, директор долго пытался добиться от маркетолога обоснования ее действий и обозначения следующих шагов. Утомившись, он произнес:","phrase": "Лена, ну просто представь, что бы ты делала, если бы была нормальным специалистом","roles": ["Генеральный директор","Лена, маркетолог"]},{"id": "o4","kind": "main","num": "4","title": "Шов раздора","text": "Дизайнер объяснила мастеру по укладке керамогранита, что шов между плитками должен быть «тонким и изящным», 2 мм. Приехав через день, она увидела швы в 4 мм. На вопрос «Что пошло не так?» мастер ответил:","phrase": "Какая плитка, такие и швы","roles": ["Мастер","Дизайнер"]},{"id": "o5","kind": "main","num": "5","title": "Рабочее поручение","text": "Молодой сотрудник получил задание, но выполнил его по-своему, не согласовав с руководителем. Начальник спросил его:","phrase": "Может, стоит сначала спросить, как правильно? Или вы художник и так видите?","roles": ["Начальник","Молодой сотрудник"]},{"id": "o6","kind": "main","num": "6","title": "Дрова везем","text": "Пассажир в маршрутном такси сделал замечание водителю о его резкой манере вождения: «Можно, пожалуйста, поаккуратнее? Не дрова везете». В ответ он услышал:","phrase": "Что погрузили, то и везу","roles": ["Водитель маршрутки","Пассажир"]},{"id": "o7","kind": "main","num": "7","title": "Опоздание","text": "Перед началом планерки несколько коллег пили кофе на общей кухне и случайно его пролили. Один из менеджеров остался прибрать и опоздал на планерку. Второй менеджер обратил на это внимание, сказав:","phrase": "Ты опоздал, полы мыть, видимо, важнее","roles": ["Второй менеджер","Опоздавший менеджер"]},{"id": "o8","kind": "main","num": "8","title": "Чашку кофею я тебе бодрящего налью","text": "Молодой бариста попросил постоянного клиента не пользоваться своей чашкой, ссылаясь на правила заведения. Клиент ответил:","phrase": "Вы каждый месяц меняетесь, а я уже пять лет пью здесь кофе из этой чашки","roles": ["Клиент","Бариста"]},{"id": "o9","kind": "main","num": "9","title": "Неприкрытая лесть","text": "В большом коллективе одной из Компаний кадровый работник предупредила, что приезжает проверяющий топ-руководитель и необходимо соблюдать в течение недели деловой стиль одежды. Мужчины надели деловые костюмы, девушки строгие платья и блузки. Начальница одного из отделов, состоящего из мужчин, сделала комплимент своим подчиненным, сказав, что мужчинам очень идут костюмы, смотрится это стильно. На что получила комментарий сотрудника:","phrase": "За доплату готовы всегда так одеваться!","roles": ["Сотрудник","Начальница отдела"]},{"id": "o10","kind": "main","num": "10","title": "Тайный переезд","text": "Три подруги гуляли по улице: Екатерина, Антонина и Алена. Подруга Антонина поделилась, что собирается переезжать в Питер в начале ноября, и попросила не рассказывать никому. Подруга Алена, обращаясь к Екатерине, сказала:","phrase": "Ну конечно, если знает Катя, знает и весь район!","roles": ["Алена","Екатерина","Антонина"]},{"id": "o11","kind": "main","num": "11","title": "Я так смотрю, вы совсем не боец?","text": "На собеседовании в динамичную компанию по продажам кандидат (Александр) рассказывает, что предпочитает взвешенные решения, не любит агрессивных методов и старается избегать конфликтов. Руководитель отдела (Елена), проводившая собеседование кандидата, перебивает:","phrase": "Я так смотрю, вы совсем не боец?","roles": ["Елена, руководитель отдела","Александр, кандидат"]},{"id": "o12","kind": "main","num": "12","title": "Анютины глазки","text": "В приемной руководителя секретарь заработалась за монитором и забыла, что своей очереди ожидает коллега. Когда он напомнил о себе, Анна с иронией объяснила, что у нее «память девичья». На что коллега ответил:","phrase": "Главное, чтобы не было «куриной слепоты»!","roles": ["Коллега","Анна, секретарь"]},{"id": "o13","kind": "main","num": "13","title": "Детектор лжи","text": "Директор на совещании, посвященном участившимся в фирме хищениям, дал распоряжение руководителям подразделений объявить своим работникам, что будут проходить проверку на «детекторе лжи». В ответ на это один руководитель заявил:","phrase": "А если не будет эффекта? Пытать всех начнете?","roles": ["Руководитель подразделения","Директор"]},{"id": "o14","kind": "main","num": "14","title": "Кто в кабинете хозяйка?","text": "Мария и Татьяна работают в одном кабинете. Мария ухаживает за всем кабинетом, цветами, интерьером. Татьяна только за своим рабочим местом. Марии нравится в целом поддерживать порядок, но энтузиазм угасает, так как от Татьяны в этом вопросе помощи практически нет. Как-то раз Мария направилась в уборную помыть свою кружку. Татьяна, увидев это, говорит:","phrase": "О! А ты не могла бы и мою кружку захватить?","roles": ["Татьяна","Мария"]},{"id": "o15","kind": "main","num": "15","title": "«Петь-то умеете?»","text": "Музыкальная группа перед выступлением прогоняет программу на сцене. Вокалистки поют старую добрую песню. Входит в зал солидный мужчина, усаживается в кресло, внимательно слушает. Как только песня закончилась, выдает:","phrase": "А вы неправильно поете. Так петь нельзя!","roles": ["Солидный мужчина","Вокалистка"]},{"id": "o16","kind": "main","num": "16","title": "На ковре начальника","text": "После стратегического совещания по благоустройству города, где молодой сотрудник Света активно предлагала идеи и вступала в профессиональную дискуссию, руководитель попросил ее задержаться. Когда дверь кабинета закрылась, он с улыбкой спросил:","phrase": "Света, а кто сказал, что ты можешь это все предлагать?","roles": ["Руководитель","Света"]},{"id": "o17","kind": "main","num": "17","title": "Непунктуальный друг","text": "Виктор с женой решил поехать на шашлыки, позвал с собой друга с семьей. Договорились встретиться в дороге на полпути в придорожном кафе в 11:00 и дальше ехать вместе. Друзья опоздали на час, не предупредив. Такое поведение и раньше за ними было замечено. Виктор в сердцах сказал другу:","phrase": "Ну наконец-то! Как у тебя еще бизнес не развалился при такой пунктуальности?","roles": ["Виктор","Друг"]},{"id": "o18","kind": "main","num": "18","title": "Удобное кресло","text": "Руководители заходят в кабинет директора на совещание. Директора еще нет, а за его местом работает директор по персоналу. Главный бухгалтер с ухмылкой произносит громко:","phrase": "А ты, никак, директора подсиживаешь?","roles": ["Главный бухгалтер","Директор по персоналу"]},{"id": "o19","kind": "main","num": "19","title": "Кто подаст стакан воды?","text": "Во время обеда на общей кухне Мария возмущенно обсуждает повышение цен на сено и то, что теперь ей сложно содержать своего жеребца в конюшне. Все увлеченно начали делиться, где дешевле закупить сено и корм. А Надежда Петровна из бухгалтерии ей говорит:","phrase": "Конь в старости стакан воды не подаст. Детей тебе надо","roles": ["Надежда Петровна","Мария"]},{"id": "o20","kind": "main","num": "20","title": "Усы","text": "Молодой сотрудник отдела продаж Роман приходит на работу после отпуска с новыми усами и ярким загаром. Во время планерки, при защите отчета, Роман допускает ошибку в расчетах и неловко подвешивает паузу в докладе. На что начальник отдела, не дав договорить, усмехается и говорит:","phrase": "Вижу, что усы ты просто так отрастил, чтобы умнее выглядеть","roles": ["Начальник отдела","Роман"]},{"id": "o21","kind": "main","num": "21","title": "Случай на парковке","text": "Татьяна приезжает на работу на новом автомобиле. Евгений, столкнувшись с ней на парковке, в привычной шутливой манере замечает, что с покупкой таких автомобилей люди становятся другими. На что получает ответ:","phrase": "Понятно, почему ты не меняешься!","roles": ["Татьяна","Евгений"]},{"id": "o22","kind": "main","num": "22","title": "Маркетолог или бариста","text": "Разговаривая на рабочей кухне, секретарь поделилась с коллегой, что хочет подать заявку на конкурсную вакансию в отдел маркетинга и пойти на повышение. На что получила от коллеги комментарий:","phrase": "В отделе маркетинга нужен специалист, а не бариста","roles": ["Коллега","Секретарь"]},{"id": "o23","kind": "main","num": "23","title": "Общение в чате","text": "Коллега написал в корпоративный чат сообщение слишком сложным языком, используя несвойственные ему речевые обороты. При встрече другой сотрудник спросил его:","phrase": "А в жизни двух слов связать не можешь. Ты что, искусственным интеллектом пользовался?","roles": ["Сотрудник","Коллега"]},{"id": "o24","kind": "main","num": "24","title": "Заказ","text": "Молодая девушка приехала в магазин, чтобы забрать свой заказ. Тут она узнает от менеджера по продажам, что заказ был отменен, но ее он об этом предупредить не успел. Выслушав этот ответ, девушка язвительно заявила:","phrase": "То есть ваше время настолько дороже моего?","roles": ["Девушка","Менеджер по продажам"]},{"id": "o25","kind": "main","num": "25","title": "Зато не пешком","text": "Иван подходил к своему припаркованному возле торгового центра автомобилю марки Нива. Рядом с ним стоял новый БМВ, в котором сидел его одноклассник. Одноклассник узнал Ивана, оглядел его машину и сказал с ухмылкой:","phrase": "Ну что, Ваня, зато oles": ["Волонтер","Руководитель конного клуба"]},{"id": "o31","kind": "main","num": "31","title": "Быстрый Юрий","text": "Менеджер по работе с клиентами Юрий договорился о встрече со своим постоянным крупным заказчиком. Договоренность была осуществлена по личному телефону с генеральным директором, когда тот ему позвонил со словами: «Срочно приезжай, будет большой проект». Приехав в самое ближайшее время, Юрий, как и всегда, сразу идет в сторону кабинета генерального, но ему перегораживает дорогу секретарь, явно недавно работающая здесь девушка, и говорит:","phrase": "Притормозите коней, мужчина! Тут вам не ипподром!","roles": ["Секретарь","Юрий"]},{"id": "o32","kind": "main","num": "32","title": "ГамлетОк","text": "В драматическом театре идет репетиция спектакля «Гамлет». У артиста, который играет главную роль, плохое настроение. Поэтому он вяло, без выражения произносит текст, не эмоционален, не убедителен. Режиссер, который делает большую ставку на этот спектакль и этого артиста в главной роли, через два часа репетиции произносит:","phrase": "А ну, соберись! Тебе только колобка играть!","roles": ["Режиссер","Артист"]},{"id": "z1","kind": "spare","num": "1","title": "Парковка","text": "Управляющая компания имеет собственную парковку. Борис работает в данной компании бухгалтером уже много лет и ставит свою машину всегда на одно и то же место (оно в тени и расположено близко к главному входу). Недавно устроившийся в эту компанию на должность юриста Олег, приехав пораньше, стал парковаться на это удобное место. Подъехавший Борис увидел происходящее и заявил новичку:","phrase": "Давай, отгоняй машину, это мое место!","roles": ["Борис, бухгалтер","Олег, юрист"]},{"id": "z2","kind": "spare","num": "2","title": "Новый цвет","text": "Семейная пара делает ремонт в своем доме. Жена выбрала новый цвет для покраски стен. Муж нанимает бригаду отделочников. Начальник бригады, увидев выбранный оттенок, говорит мужу:","phrase": "А у вашей жены все хорошо с настроением? Может, еще const APP_VERSION = "1.3";
const ROUND_SEC = 40; // в поединке за каждую роль играешь по 40 секунд
const KEY = "express-poedinki-v1";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- data ---------- */
let db;
function newVariant(){ return {a:"", c:""}; }
function fromSeed(s){
  return {id:s.id, kind:s.kind, num:s.num, title:s.title, text:s.text, phrase:s.phrase,
    roles:s.roles.map((r,i) => ({id:uid(), name:r, said:i===0, an:"", vars:[newVariant()]}))};
}
function load(){
  try{ db = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){ db = null; }
  if(!db || !Array.isArray(db.situations)){
    db = {v:1, situations:SEED.map(fromSeed), seeded:SEED.map(s => s.id)};
    save(true);
  }else{
    // новые ситуации из обновленной версии приложения
    db.seeded = db.seeded || [];
    let added = 0;
    for(const s of SEED){ if(!db.seeded.includes(s.id)){ db.situations.push(fromSeed(s)); db.seeded.push(s.id); added++; } }
    if(added) save(true);
  }
}
let saveT;
function save(now){
  clearTimeout(saveT);
  const go = () => { try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("Не удалось сохранить: " + e.message); } };
  if(now) go(); else saveT = setTimeout(go, 300);
}
window.addEventListener("pagehide", () => save(true));
document.addEventListener("visibilitychange", () => { if(document.hidden) save(true); });
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

const byId = id => db.situations.find(s => s.id === id);
function roleDone(r){ return r.vars.some(v => v.a.trim() && v.c.trim()); }
function status(s){
  if(!s.roles.length) return "none";
  if(s.roles.every(roleDone)) return "full";
  if(s.roles.some(r => r.vars.some(v => v.a.trim() || v.c.trim()))) return "part";
  return "none";
}
function numLabel(s){ return s.kind === "spare" ? "З" + s.num : s.num; }
function fullNum(s){ return s.kind === "spare" ? "Запасная " + s.num : "Ситуация " + s.num; }
function sorted(){
  const k = s => (s.kind === "spare" ? 1 : 0);
  const n = s => { const x = parseFloat(s.num); return isNaN(x) ? 1e9 : x; };
  return db.situations.slice().sort((a,b) => k(a)-k(b) || n(a)-n(b) || String(a.title).localeCompare(b.title,"ru"));
}

/* ---------- list ---------- */
let filter = "all";
const FILTERS = [["all","Все"],["todo","Не готовы"],["done","Готовы"],["played","Сыгранные"],["main","Основные"],["spare","Запасные"]];
function renderChips(){
  $("#chips").innerHTML = FILTERS.map(([k,l]) => `<button class="chip${k===filter?" on":""}" data-f="${k}">${l}</button>`).join("");
}
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if(!b) return; filter = b.dataset.f; renderChips(); renderList(); });
$("#q").addEventListener("input", renderList);

function visible(){
  const q = $("#q").value.trim().toLowerCase();
  return sorted().filter(s => {
    const st = status(s);
    if(filter === "todo" && st === "full") return false;
    if(filter === "done" && st !== "full") return false;
    if(filter === "main" && s.kind === "spare") return false;
    if(filter === "spare" && s.kind !== "spare") return false;
    if(filter === "played" && !games(s).length) return false;
    if(!q) return true;
    const hay = [s.num, s.title, s.text, s.phrase, ...s.roles.flatMap(r => [r.name, r.an || "", ...r.vars.flatMap(v => [v.a, v.c])]), ...games(s).flatMap(g => [g.opp, g.note])].join(" ").toLowerCase();
    return hay.includes(q);
  });
}
function renderList(){
  const all = db.situations, done = all.filter(s => status(s) === "full").length;
  $("#pbar").style.width = (all.length ? done/all.length*100 : 0) + "%";
  $("#ptext").textContent = `готово ${done} из ${all.length}`;
  const ng = allGames().length;
  $("#btnJournal").textContent = ng ? `Журнал · ${ng}` : "Журнал";
  const items = visible();
  $("#list").innerHTML = items.length ? items.map(s => `
    <button class="card" data-id="${s.id}">
      <span class="num${s.kind==="spare"?" spare":""}">${esc(numLabel(s))}</span>
      <span class="body"><span class="t">${esc(s.title || "Без названия")}</span>
      <span class="q">«${esc(s.phrase)}»</span>${gamesMeta(s)}</span>
      <span class="dot ${status(s)}" title="${{none:"не готово",part:"частично",full:"готово"}[status(s)]}"></span>
    </button>`).join("") : `<div class="empty">Ничего не найдено</div>`;
}
$("#list").addEventListener("click", e => { const c = e.target.closest(".card"); if(c) go("s/" + c.dataset.id); });

/* ---------- detail ---------- */
let cur = null;
function renderDetail(){
  const s = cur;
  $("#dBarTitle").textContent = fullNum(s);
  $("#dBody").innerHTML = `
    <div class="kicker">${esc(fullNum(s))}</div>
    <h2 class="dtitle">${esc(s.title)}</h2>
    <p class="desc">${esc(s.text)}</p>
    <div class="quote">«${esc(s.phrase)}»</div>
    <div id="roles">${s.roles.map(roleHTML).join("")}</div>
    <button class="link" id="addRole">+ Добавить роль</button>
    <div class="row"><button class="btn pri" id="dTrain">Тренировать эту ситуацию</button></div>
    <h3 class="sec">Сыгранные поединки ${games(s).length ? `<small>${scoreLine(games(s))}</small>` : ""}</h3>
    ${games(s).length ? sortGames(games(s)).map(g => gameHTML(s, g, false)).join("") : `<p class="desc" style="color:var(--muted)">По этой ситуации поединков еще не было.</p>`}
    <button class="link" id="addGame">+ Записать поединок</button>`;
  $$autosize($("#dBody"));
}
function roleHTML(r){
  const many = r.vars.length > 1;
  return `<div class="role" data-r="${r.id}">
    <div class="rolehead"><h3>${esc(r.name)}${r.said ? ` <span class="said">сказал(а) фразу</span>` : ""}</h3>
      <button class="ib" data-act="roleMenu" aria-label="Роль: действия"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button></div>
    <div class="var an">
      <label class="fl n">Анализ ситуации</label>
      <textarea class="f" data-k="an" rows="2" placeholder="Чего хочет ${esc(r.name)}, что стоит за фразой, какая цель у ответа, на что опереться">${esc(r.an || "")}</textarea>
    </div>
    ${r.vars.map((v,i) => `<div class="var" data-v="${i}">
      ${many ? `<div class="vhead"><span>Вариант ${i+1}</span>
        <button class="ib" data-act="delVar" aria-label="Удалить вариант"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>` : ""}
      <label class="fl a">Ответная фраза</label>
      <textarea class="f" data-k="a" rows="1" placeholder="Что отвечает ${esc(r.name)}">${esc(v.a)}</textarea>
      <label class="fl c">Контрфраза на ответ</label>
      <textarea class="f" data-k="c" rows="1" placeholder="Что могут сказать в ответ и как парировать">${esc(v.c)}</textarea>
    </div>`).join("")}
    <button class="link" data-act="addVar">+ Еще вариант</button>
  </div>`;
}
function $$autosize(root){ root.querySelectorAll("textarea.f").forEach(autosize); }
function autosize(t){ t.style.height = "auto"; t.style.height = (t.scrollHeight + 2) + "px"; }

$("#dBody").addEventListener("input", e => {
  const t = e.target; if(!t.matches("textarea.f")) return;
  autosize(t);
  const r = cur.roles.find(x => x.id === t.closest("[data-r]").dataset.r);
  if(t.dataset.k === "an") r.an = t.value;
  else r.vars[+t.closest("[data-v]").dataset.v][t.dataset.k] = t.value;
  save();
});
$("#dBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.id === "addRole") return roleSheet(null);
  if(b.id === "addGame") return gameSheet(cur, null);
  if(b.dataset.g) return gameSheet(cur, games(cur).find(g => g.id === b.dataset.g));
  if(b.id === "dTrain") return go("t/" + cur.id);
  const rEl = b.closest("[data-r]"); if(!rEl) return;
  const r = cur.roles.find(x => x.id === rEl.dataset.r);
  if(b.dataset.act === "addVar"){ r.vars.push(newVariant()); save(); renderDetail(); focusLast(r); }
  if(b.dataset.act === "delVar"){
    const i = +b.closest("[data-v]").dataset.v, v = r.vars[i];
    if((v.a || v.c) && !confirm("Удалить этот вариант?")) return;
    r.vars.splice(i,1); save(); renderDetail();
  }
  if(b.dataset.act === "roleMenu") roleSheet(r);
});
function focusLast(r){
  const el = document.querySelector(`[data-r="${r.id}"] .var:last-of-type textarea`);
  if(el){ el.focus(); el.scrollIntoView({block:"center", behavior:"smooth"}); }
}
$("#dBack").onclick = () => back();
$("#dEdit").onclick = () => editSheet(cur);

/* ---------- sheets ---------- */
function openSheet(html, onMount){
  const host = $("#sheetHost");
  host.innerHTML = `<div class="veil"><div class="sheet"><div class="grab"></div>${html}</div></div>`;
  const veil = host.firstElementChild;
  veil.addEventListener("click", e => { if(e.target === veil) closeSheet(); });
  onMount && onMount(veil.firstElementChild);
}
function closeSheet(){ $("#sheetHost").innerHTML = ""; }

function roleSheet(r){
  openSheet(`<h2>${r ? "Роль" : "Новая роль"}</h2>
    <div class="fld"><label>Название роли</label><input id="rName" value="${esc(r ? r.name : "")}" placeholder="Например: Начальник отдела"></div>
    <button class="btn pri full" id="rOk">${r ? "Сохранить" : "Добавить"}</button>
    ${r ? `<div style="height:10px"></div><button class="btn dng full" id="rDel">Удалить роль</button>` : ""}`, sh => {
    const inp = sh.querySelector("#rName"); setTimeout(() => inp.focus(), 50);
    sh.querySelector("#rOk").onclick = () => {
      const name = inp.value.trim(); if(!name) return inp.focus();
      if(r) r.name = name; else cur.roles.push({id:uid(), name, vars:[newVariant()]});
      save(); closeSheet(); renderDetail();
    };
    const d = sh.querySelector("#rDel");
    if(d) d.onclick = () => {
      if(!confirm(`Удалить роль «${r.name}» вместе с подготовленными фразами?`)) return;
      cur.roles = cur.roles.filter(x => x !== r); save(); closeSheet(); renderDetail();
    };
  });
}

function editSheet(s){
  const isNew = !s;
  const d = s || {kind:"main", num:"", title:"", text:"", phrase:"", roles:[]};
  let kind = d.kind;
  openSheet(`<h2>${isNew ? "Новая ситуация" : "Правка ситуации"}</h2>
    <div class="fld"><div class="seg" id="eKind"><button data-k="main">Основная</button><button data-k="spare">Запасная</button></div></div>
    <div class="fld"><label>Номер</label><input id="eNum" inputmode="numeric" value="${esc(d.num)}"></div>
    <div class="fld"><label>Название</label><input id="eTitle" value="${esc(d.title)}"></div>
    <div class="fld"><label>Описание ситуации</label><textarea class="f" id="eText" rows="3">${esc(d.text)}</textarea></div>
    <div class="fld"><label>Фраза (без кавычек)</label><textarea class="f" id="ePhrase" rows="2">${esc(d.phrase)}</textarea></div>
    ${isNew ? `<div class="fld"><label>Роли через запятую</label><input id="eRoles" placeholder="Кто сказал фразу, кому сказали"></div>` : ""}
    <button class="btn pri full" id="eOk">${isNew ? "Добавить" : "Сохранить"}</button>
    ${isNew ? "" : `<div style="height:10px"></div><button class="btn dng full" id="eDel">Удалить ситуацию</button>`}`, sh => {
    const seg = sh.querySelector("#eKind");
    const paint = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === kind));
    paint(); seg.onclick = e => { const b = e.target.closest("button"); if(b){ kind = b.dataset.k; paint(); } };
    $$autosize(sh); sh.addEventListener("input", e => e.target.matches("textarea.f") && autosize(e.target));
    if(isNew){
      const nums = db.situations.filter(x => x.kind === "main").map(x => parseFloat(x.num)).filter(x => !isNaN(x));
      sh.querySelector("#eNum").value = nums.length ? Math.max(...nums) + 1 : 1;
    }
    sh.querySelector("#eOk").onclick = () => {
      const v = id => sh.querySelector(id).value.trim();
      const phrase = v("#ePhrase").replace(/^[«"]+|[»"]+$/g, "").trim();
      if(!v("#eTitle") && !phrase){ toast("Нужно хотя бы название или фраза"); return; }
      if(isNew){
        const roles = (v("#eRoles") || "Кто сказал фразу, Кому сказали").split(/[,;]/).map(x => x.trim()).filter(Boolean);
        const ns = {id:"u" + uid(), kind, num:v("#eNum"), title:v("#eTitle"), text:v("#eText"), phrase,
          roles:roles.map(name => ({id:uid(), name, vars:[newVariant()]}))};
        db.situations.push(ns); save(true); closeSheet(); go("s/" + ns.id);
      }else{
        Object.assign(s, {kind, num:v("#eNum"), title:v("#eTitle"), text:v("#eText"), phrase});
        save(true); closeSheet(); renderDetail();
      }
    };
    const del = sh.querySelector("#eDel");
    if(del) del.onclick = () => {
      if(!confirm(`Удалить ситуацию «${s.title}» со всей подготовкой?`)) return;
      db.situations = db.situations.filter(x => x !== s); save(true); closeSheet(); back();
    };
  });
}

/* ---------- played duels ---------- */
const RES = {win:"Победа", loss:"Поражение", draw:"Ничья"};
const games = s => s.games || (s.games = []);
const allGames = () => db.situations.flatMap(s => games(s).map(g => ({s, g})));
const sortGames = a => a.slice().sort((x,y) => String(y.date||"").localeCompare(String(x.date||"")) || (y.t||0) - (x.t||0));
function gameRole(s, g){ const r = s.roles.find(x => x.id === g.role); return r ? r.name : (g.roleName || ""); }
function fmtDate(d){ if(!d) return "без даты"; const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(d); return m ? `${m[3]}.${m[2]}.${m[1]}` : d; }
function today(){ const d = new Date(), p = n => String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }
function plural(n, a, b, c){ const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? a : (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? b : c); }
function counts(list){ const c = {win:0, loss:0, draw:0}; list.forEach(g => { if(c[g.res] !== undefined) c[g.res]++; }); return c; }
function scoreLine(list){ const c = counts(list); return `${c.win} ${plural(c.win,"победа","победы","побед")}, ${c.loss} ${plural(c.loss,"поражение","поражения","поражений")}${c.draw ? `, ${c.draw} ${plural(c.draw,"ничья","ничьи","ничьих")}` : ""}`; }
function gamesMeta(s){
  const list = games(s); if(!list.length) return "";
  const c = counts(list);
  return `<span class="meta">сыграно ${list.length}${c.win ? ` · <span class="w">${c.win} ${plural(c.win,"победа","победы","побед")}</span>` : ""}${c.loss ? ` · <span class="l">${c.loss} ${plural(c.loss,"поражение","поражения","поражений")}</span>` : ""}</span>`;
}
function gameHTML(s, g, withSit){
  const role = gameRole(s, g);
  return `<button class="game" data-g="${g.id}" data-s="${s.id}">
    <span class="gb">
      <span class="g1">${withSit ? esc(numLabel(s)) + ". " + esc(s.title) : (g.opp ? "с " + esc(g.opp) : "Соперник не указан")}</span>
      <span class="g2">${esc(fmtDate(g.date))}${withSit ? " · " + (g.opp ? "с " + esc(g.opp) : "соперник не указан") : ""}${role ? " · начинал за: " + esc(role) : ""}</span>
      ${g.note ? `<span class="g3">${esc(g.note)}</span>` : ""}
    </span>
    <span class="res ${g.res || ""}">${RES[g.res] || "без итога"}${g.score ? `<br>${esc(g.score)}` : ""}</span>
  </button>`;
}
function oppNames(){ const m = new Map(); allGames().forEach(({g}) => { const n = (g.opp || "").trim(); if(n) m.set(n.toLowerCase(), n); }); return [...m.values()].sort((a,b) => a.localeCompare(b,"ru")); }

function gameSheet(s, g){
  const isNew = !g;
  const d = g || {date:today(), opp:"", role:"", res:"", score:"", note:""};
  let res = d.res, sit = s;
  const sitPick = !s;
  const roleOpts = x => `<option value="">не указана</option>` + (x ? x.roles.map(r => `<option value="${r.id}"${r.id === d.role ? " selected" : ""}>${esc(r.name)}</option>`).join("") : "");
  openSheet(`<h2>${isNew ? "Записать поединок" : "Поединок"}</h2>
    ${sitPick ? `<div class="fld"><label>Ситуация</label><select id="gSit"><option value="">выберите ситуацию</option>${sorted().map(x =>
      `<option value="${x.id}">${esc(numLabel(x))}. ${esc(x.title)}</option>`).join("")}</select></div>` : `<p class="desc" style="color:var(--muted);margin-top:-4px">${esc(fullNum(s))} · ${esc(s.title)}</p>`}
    <div class="fld"><label>Дата</label><input id="gDate" type="date" value="${esc(d.date)}"></div>
    <div class="fld"><label>С кем играл</label><input id="gOpp" list="oppList" value="${esc(d.opp)}" placeholder="Имя или псевдоним соперника" autocomplete="off">
      <datalist id="oppList">${oppNames().map(n => `<option value="${esc(n)}">`).join("")}</datalist></div>
    <div class="fld"><label>Начинал за роль</label><select id="gRole">${roleOpts(s)}</select></div>
    <div class="fld"><label>Результат</label><div class="seg" id="gRes"><button data-k="win">Победа</button><button data-k="loss">Поражение</button><button data-k="draw">Ничья</button></div></div>
    <div class="fld"><label>Голоса судей (если есть)</label><input id="gScore" value="${esc(d.score)}" placeholder="например 3:2"></div>
    <div class="fld"><label>Заметки: что сказал, что сработало, что бы сделал иначе</label><textarea class="f" id="gNote" rows="3">${esc(d.note)}</textarea></div>
    <button class="btn pri full" id="gOk">${isNew ? "Записать" : "Сохранить"}</button>
    ${isNew ? "" : `<div style="height:10px"></div><button class="btn dng full" id="gDel">Удалить запись</button>`}`, sh => {
    const seg = sh.querySelector("#gRes");
    const paint = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === res));
    paint(); seg.onclick = e => { const b = e.target.closest("button"); if(b){ res = res === b.dataset.k ? "" : b.dataset.k; paint(); } };
    $$autosize(sh); sh.addEventListener("input", e => e.target.matches("textarea.f") && autosize(e.target));
    if(sitPick) sh.querySelector("#gSit").onchange = e => { sit = byId(e.target.value) || null; sh.querySelector("#gRole").innerHTML = roleOpts(sit); };
    sh.querySelector("#gOk").onclick = () => {
      if(!sit){ toast("Выберите ситуацию"); return; }
      const v = id => sh.querySelector(id).value.trim();
      const roleId = sh.querySelector("#gRole").value, r = sit.roles.find(x => x.id === roleId);
      const rec = {date:v("#gDate"), opp:v("#gOpp"), role:roleId, roleName:r ? r.name : "", res, score:v("#gScore"), note:sh.querySelector("#gNote").value.trim()};
      if(isNew) games(sit).push(Object.assign({id:uid(), t:Date.now()}, rec)); else Object.assign(g, rec);
      save(true); closeSheet(); rerender();
      if(isNew) toast("Поединок записан");
    };
    const del = sh.querySelector("#gDel");
    if(del) del.onclick = () => {
      if(!confirm("Удалить запись об этом поединке?")) return;
      s.games = games(s).filter(x => x !== g); save(true); closeSheet(); rerender();
    };
  });
}
function rerender(){
  if(!$("#vDetail").classList.contains("hidden")) renderDetail();
  else if(!$("#vJournal").classList.contains("hidden")) renderJournal();
  else renderList();
}

/* ---------- journal ---------- */
let jQuery = "";
function renderJournal(){
  const list = allGames(), c = counts(list.map(x => x.g));
  const q = jQuery.trim().toLowerCase();
  const shown = list.filter(({s, g}) => !q || [g.opp, g.note, s.title, s.num, gameRole(s, g)].join(" ").toLowerCase().includes(q))
    .sort((a,b) => String(b.g.date||"").localeCompare(String(a.g.date||"")) || (b.g.t||0) - (a.g.t||0));
  const byOpp = new Map();
  list.forEach(({g}) => { const n = (g.opp || "").trim(); if(!n) return; const k = n.toLowerCase();
    const o = byOpp.get(k) || {name:n, list:[]}; o.list.push(g); byOpp.set(k, o); });
  const opps = [...byOpp.values()].sort((a,b) => b.list.length - a.list.length || a.name.localeCompare(b.name,"ru"));
  $("#jBody").innerHTML = `
    <div class="stats">
      <div class="stat"><b>${list.length}</b><span>всего</span></div>
      <div class="stat"><b style="color:var(--ok)">${c.win}</b><span>побед</span></div>
      <div class="stat"><b style="color:var(--accent)">${c.loss}</b><span>поражений</span></div>
      <div class="stat"><b>${c.draw}</b><span>ничьих</span></div>
    </div>
    ${list.length ? `<div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="jq" type="search" placeholder="Соперник, ситуация, заметки" value="${esc(jQuery)}" autocomplete="off"></div>` : ""}
    ${opps.length && !q ? `<h3 class="sec">Соперники</h3><div class="opps">${opps.map(o => { const k = counts(o.list);
      return `<button class="opp" data-opp="${esc(o.name)}"><span>${esc(o.name)}</span><span>${o.list.length} · ${k.win}:${k.loss}${k.draw ? ":" + k.draw : ""}</span></button>`; }).join("")}</div>` : ""}
    <h3 class="sec">${q ? "Найдено: " + shown.length : "Все поединки"}</h3>
    ${shown.length ? shown.map(({s, g}) => gameHTML(s, g, true)).join("") : `<div class="empty">${list.length ? "Ничего не найдено" : "Пока ни одного поединка. Записывайте их кнопкой «+» здесь или в карточке ситуации."}</div>`}`;
  const inp = $("#jq");
  if(inp) inp.oninput = () => { jQuery = inp.value; const pos = inp.selectionStart; renderJournal(); const n = $("#jq"); n.focus(); n.setSelectionRange(pos, pos); };
}
$("#jBody").addEventListener("click", e => {
  const o = e.target.closest("[data-opp]"); if(o){ jQuery = o.dataset.opp; renderJournal(); return; }
  const b = e.target.closest("[data-g]"); if(!b) return;
  const s = byId(b.dataset.s); if(s) gameSheet(s, games(s).find(g => g.id === b.dataset.g));
});
$("#btnJournal").onclick = () => { jQuery = ""; go("j"); };
$("#jBack").onclick = () => back();
$("#jAdd").onclick = () => gameSheet(null, null);

/* ---------- menu, export, import ---------- */
$("#btnAdd").onclick = () => editSheet(null);
$("#btnMenu").onclick = () => openSheet(`<h2>Тема</h2>
  <div class="fld"><div class="seg" id="mTheme"><button data-k="auto">Как в системе</button><button data-k="light">Светлая</button><button data-k="dark">Темная</button></div></div>
  <h2>Данные</h2><div class="menu">
    <button id="mExp">Сохранить резервную копию (JSON)</button>
    <button id="mImp">Загрузить из копии</button>
    <button id="mTxt">Скопировать всю подготовку текстом</button>
  </div>
  <p class="menu note">Версия ${APP_VERSION}. Подготовка хранится только на этом устройстве, в этом браузере. Добавьте страницу на экран «Домой» (Поделиться → На экран «Домой»), чтобы iOS не очистила данные, и время от времени сохраняйте копию.</p>`, sh => {
    const seg = sh.querySelector("#mTheme");
    const paint = () => seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === getTheme()));
    paint(); seg.onclick = e => { const b = e.target.closest("button"); if(b){ setTheme(b.dataset.k); paint(); } };
    sh.querySelector("#mExp").onclick = () => { closeSheet(); exportJSON(); };
    sh.querySelector("#mImp").onclick = () => { closeSheet(); $("#fileIn").click(); };
    sh.querySelector("#mTxt").onclick = () => { closeSheet(); copyText(); };
  });

async function exportJSON(){
  save(true);
  const d = new Date(), p = n => String(n).padStart(2,"0");
  const name = `express-poedinki-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
  const blob = new Blob([JSON.stringify(db, null, 1)], {type:"application/json"});
  const file = new File([blob], name, {type:"application/json"});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }catch(e){ if(e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
$("#fileIn").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if(!f) return;
  try{
    const d = JSON.parse(await f.text());
    if(!d || !Array.isArray(d.situations)) throw new Error("это не копия приложения");
    if(!confirm(`В копии ${d.situations.length} ситуаций. Заменить ими текущие данные?`)) return;
    db = d; db.seeded = db.seeded || SEED.map(s => s.id); save(true); go("", true); toast("Копия загружена");
  }catch(err){ alert("Не удалось прочитать файл: " + err.message); }
});
function copyText(){
  const out = sorted().map(s => [
    `${fullNum(s)}. ${s.title}`, s.text, `«${s.phrase}»`,
    ...s.roles.map(r => [`  ${r.name}:`, ...(r.an && r.an.trim() ? [`  Анализ: ${r.an.trim()}`] : []), ...r.vars.filter(v => v.a || v.c).map((v,i,arr) =>
      `${arr.length > 1 ? "  Вариант " + (i+1) + "\n" : ""}  Ответ: ${v.a || "-"}\n  Контрфраза: ${v.c || "-"}`)].join("\n")),
    ...(games(s).length ? ["  Сыгранные поединки:", ...sortGames(games(s)).map(g =>
      `  ${fmtDate(g.date)}, соперник: ${g.opp || "-"}, начинал за: ${gameRole(s,g) || "-"}, ${RES[g.res] ? RES[g.res] : "результат не указан"}${g.score ? " " + g.score : ""}${g.note ? "\n    " + g.note.replace(/\n/g, "\n    ") : ""}`)] : [])
  ].join("\n")).join("\n\n");
  const done = () => toast("Скопировано");
  if(navigator.clipboard) navigator.clipboard.writeText(out).then(done, () => fallbackCopy(out));
  else fallbackCopy(out);
}
function fallbackCopy(t){
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Скопировано"); }catch(e){} ta.remove();
}

/* ---------- training ---------- */
let tAn = false, tQueue = [], tIdx = 0, tRole = null, tShown = 0, tTick;
let rState = "idle", rEnd = 0, rDone = new Set(), rMsg = "", audioCtx = null;
function startTraining(ids){
  tQueue = ids; tIdx = 0; tRole = null; renderTrain();
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function renderTrain(){
  const s = byId(tQueue[tIdx]); if(!s){ back(); return; }
  if(!tRole || !s.roles.find(r => r.id === tRole)) tRole = s.roles[0] && s.roles[0].id;
  tShown = 0; tAn = false; clearInterval(tTick); rState = "idle"; rDone = new Set(); rMsg = ""; $("#tTimer").textContent = "";
  $("#tBarTitle").textContent = tQueue.length > 1 ? `${tIdx+1} из ${tQueue.length}` : "Тренировка";
  const r = s.roles.find(x => x.id === tRole);
  $("#tBody").innerHTML = `
    <div class="kicker">${esc(fullNum(s))} · ${esc(s.title)}</div>
    <p class="tr-desc">${esc(s.text)}</p>
    <div class="tr-q">«${esc(s.phrase)}»</div>
    ${s.roles.length > 1 ? `<div class="kicker">Ваша роль</div><div class="rolepick">${s.roles.map(x =>
      `<button class="chip${x.id===tRole?" on":""}" data-role="${x.id}">${esc(x.name)}</button>`).join("")}</div>` : ""}
    <div class="round" id="tRound"></div>
    <div id="tReveal"></div>
    <div class="row">${tQueue.length > 1 ? `<button class="btn" id="tPrev">Назад</button><button class="btn pri" id="tNext">${tIdx < tQueue.length-1 ? "Дальше" : "Заново"}</button>` : `<button class="btn" id="tOpen">Открыть подготовку</button>`}</div>`;
  paintReveal(r); paintRound();
}

/* ---------- раунд 40 секунд на роль ---------- */
function paintRound(){
  const s = byId(tQueue[tIdx]), box = $("#tRound"); if(!s || !box) return;
  const r = s.roles.find(x => x.id === tRole);
  document.querySelectorAll("[data-role]").forEach(x => {
    x.classList.toggle("on", x.dataset.role === tRole);
    const nm = s.roles.find(y => y.id === x.dataset.role).name;
    x.textContent = (rDone.has(x.dataset.role) ? "✓ " : "") + nm;
  });
  if(rState === "run"){
    const left = Math.max(0, rEnd - Date.now()), sec = Math.ceil(left / 1000);
    box.innerHTML = `<div class="rlbl">Играете за: ${esc(r ? r.name : "")}</div>
      <div class="rbig${sec <= 10 ? " warn" : ""}" id="rNum">${sec}</div>
      <div class="rbar"><i id="rBar" style="width:${left / (ROUND_SEC * 10)}%"></i></div>
      <button class="btn" id="rStop">Стоп</button>`;
    return;
  }
  const all = s.roles.length > 0 && s.roles.every(x => rDone.has(x.id));
  box.innerHTML = `${rMsg ? `<div class="rmsg">${esc(rMsg)}</div>` : ""}
    ${all ? `<button class="btn pri full" id="rAgain">Сыграть обе роли еще раз</button>`
          : `<div class="rlbl">${r ? "Роль: " + esc(r.name) : ""}</div>
             <div class="rbig">${ROUND_SEC}</div><div class="rlbl" style="margin-top:4px">секунд на роль</div>
             <button class="btn pri full" id="rStart" style="margin-top:12px">Старт · ${ROUND_SEC} с</button>`}`;
}
function roundTick(){
  if(rState !== "run") return;
  const left = rEnd - Date.now();
  if(left <= 0){ return roundOver(); }
  const sec = Math.ceil(left / 1000), num = $("#rNum"), bar = $("#rBar");
  $("#tTimer").textContent = "0:" + String(sec).padStart(2, "0");
  if(num){ num.textContent = sec; num.classList.toggle("warn", sec <= 10); }
  if(bar) bar.style.width = (left / (ROUND_SEC * 10)) + "%";
}
function roundStart(){
  try{ audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); }catch(e){}
  rState = "run"; rMsg = ""; rEnd = Date.now() + ROUND_SEC * 1000;
  clearInterval(tTick); tTick = setInterval(roundTick, 200);
  paintRound(); roundTick();
}
function roundStop(){ clearInterval(tTick); rState = "idle"; rMsg = ""; $("#tTimer").textContent = ""; paintRound(); }
function roundOver(){
  clearInterval(tTick); rState = "idle"; $("#tTimer").textContent = "";
  beep(); try{ navigator.vibrate && navigator.vibrate([200, 100, 200]); }catch(e){}
  const s = byId(tQueue[tIdx]); rDone.add(tRole);
  const next = s.roles.find(x => !rDone.has(x.id));
  if(next){ rMsg = `Время! Теперь играете за роль «${next.name}».`; tRole = next.id; tShown = 0; tAn = false; paintReveal(next); }
  else rMsg = "Время! Обе роли сыграны.";
  paintRound();
  const box = $("#tRound"); box.classList.remove("flash"); void box.offsetWidth; box.classList.add("flash");
}
function beep(){
  if(!audioCtx) return;
  try{
    [0, .28, .56].forEach((t0, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime + t0;
      o.frequency.value = i === 2 ? 1175 : 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .22);
      o.start(t); o.stop(t + .24);
    });
  }catch(e){}
}

function paintReveal(r){
  const host = $("#tReveal"); if(!r){ host.innerHTML = ""; return; }
  const an = (r.an || "").trim();
  const anHTML = !an ? "" : tAn
    ? `<div class="reveal"><div class="lbl n">Мой анализ · ${esc(r.name)}</div><div class="txt">${esc(an)}</div></div><button class="link" id="tAn">Скрыть анализ</button>`
    : `<button class="link" id="tAn">Показать мой анализ</button>`;
  const vars = r.vars.filter(v => v.a.trim() || v.c.trim());
  if(!vars.length){ host.innerHTML = anHTML + `<div class="empty">Для роли «${esc(r.name)}» фразы еще не подготовлены. Придумайте ответ вслух, потом откройте подготовку и запишите его.</div>`; return; }
  const steps = [];
  vars.forEach((v,i) => {
    const tag = vars.length > 1 ? ` · вариант ${i+1}` : "";
    steps.push({cls:"a", lbl:"Ответная фраза" + tag, txt:v.a || "-"});
    steps.push({cls:"c", lbl:"Контрфраза" + tag, txt:v.c || "-"});
  });
  host.innerHTML = anHTML + steps.slice(0, tShown).map(x => `<div class="reveal"><div class="lbl ${x.cls}">${x.lbl}</div><div class="txt">${esc(x.txt)}</div></div>`).join("")
    + (tShown < steps.length ? `<button class="cover" id="tShow">${tShown === 0 ? "Сначала ответьте сами, потом нажмите: показать ответную фразу" : "Показать " + (steps[tShown].cls === "a" ? "следующий вариант" : "контрфразу")}</button>` : "");
}
$("#tBody").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  const s = byId(tQueue[tIdx]);
  if(b.id === "rStart") return roundStart();
  if(b.id === "rStop") return roundStop();
  if(b.id === "rAgain"){ rDone = new Set(); rMsg = ""; tRole = s.roles[0] && s.roles[0].id; tShown = 0; tAn = false; paintReveal(s.roles[0]); return paintRound(); }
  if(b.dataset.role){
    if(rState === "run"){ toast("Сначала остановите раунд"); return; }
    tRole = b.dataset.role; tShown = 0; tAn = false; rMsg = "";
    paintReveal(s.roles.find(x => x.id === tRole)); paintRound(); return; }
  if(b.id === "tAn"){ tAn = !tAn; paintReveal(s.roles.find(x => x.id === tRole)); return; }
  if(b.id === "tShow"){ tShown++; paintReveal(s.roles.find(x => x.id === tRole)); return; }
  if(b.id === "tNext"){ tIdx = tIdx < tQueue.length-1 ? tIdx+1 : 0; if(tIdx === 0) shuffle(tQueue); renderTrain(); scrollTo(0,0); }
  if(b.id === "tPrev"){ tIdx = Math.max(0, tIdx-1); renderTrain(); scrollTo(0,0); }
  if(b.id === "tOpen"){ go("s/" + s.id, true); }
});
$("#tBack").onclick = () => back();
$("#btnTrainAll").onclick = () => {
  const ids = visible().map(s => s.id);
  if(!ids.length){ toast("Нет ситуаций в этом списке"); return; }
  trainList = shuffle(ids); go("t/*");
};
let trainList = null;

/* ---------- routing ---------- */
let listScroll = 0;
function go(h, replace){
  if(location.hash.slice(1) === "" ) listScroll = scrollY;
  if(replace) history.replaceState(null, "", "#" + h); else history.pushState(null, "", "#" + h);
  route();
}
function back(){ if(history.length > 1 && location.hash) history.back(); else go("", true); }
window.addEventListener("popstate", route);
function route(){
  closeSheet(); clearInterval(tTick);
  const h = location.hash.slice(1);
  ["#vList","#vDetail","#vTrain","#vJournal"].forEach(v => $(v).classList.add("hidden"));
  if(h.startsWith("s/") && byId(h.slice(2))){
    cur = byId(h.slice(2)); $("#vDetail").classList.remove("hidden"); renderDetail(); scrollTo(0,0);
  }else if(h === "j"){
    $("#vJournal").classList.remove("hidden"); renderJournal(); scrollTo(0,0);
  }else if(h.startsWith("t/")){
    $("#vTrain").classList.remove("hidden");
    const id = h.slice(2);
    if(id === "*"){ startTraining(trainList || shuffle(sorted().map(s => s.id))); }
    else if(byId(id)) startTraining([id]); else return go("", true);
    scrollTo(0,0);
  }else{
    $("#vList").classList.remove("hidden"); renderChips(); renderList(); requestAnimationFrame(() => scrollTo(0, listScroll));
  }
}
addEventListener("scroll", () => document.querySelectorAll(".top").forEach(t => t.classList.toggle("scrolled", scrollY > 4)), {passive:true});

let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 1800); }

load(); route();
$("#verFoot").textContent = "Версия " + APP_VERSION;
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
